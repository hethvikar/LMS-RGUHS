
    <div class="company-dashboard-container">
      <div class="dashboard-header">
        <h1>Company Dashboard</h1>
        <p>Manage your company profile and job postings</p>
      </div>

      <div class="dashboard-grid">
        <mat-card class="dashboard-card">
          <mat-card-header>
            <mat-card-title>Company Profile</mat-card-title>
            
          </mat-card-header>
          <mat-card-content>
            <p>View and update your company information</p>
          </mat-card-content>
          <mat-card-actions>
            <button mat-raised-button color="primary" (click)="navigateToProfile()">
              Manage Profile
            </button>
          </mat-card-actions>
        </mat-card>

        <mat-card class="dashboard-card">
          <mat-card-header>
            <mat-card-title>Job Postings</mat-card-title>
            
          </mat-card-header>
          <mat-card-content>
            <p>Manage your job openings and applications</p>
          </mat-card-content>
          <mat-card-actions>
            <button mat-raised-button color="primary" (click)="navigateToJobs()">
              Manage Jobs
            </button>
          </mat-card-actions>
        </mat-card>

        <mat-card class="dashboard-card">
          <mat-card-header>
            <mat-card-title>Candidates</mat-card-title>
            
          </mat-card-header>
          <mat-card-content>
            <p>Review applications and manage candidates</p>
          </mat-card-content>
          <mat-card-actions>
            <button mat-raised-button color="primary" (click)="navigateToCandidates()">
              View Candidates
            </button>
          </mat-card-actions>
        </mat-card>

        <mat-card class="dashboard-card">
          <mat-card-header>
            <mat-card-title>Interviews</mat-card-title>
            
          </mat-card-header>
          <mat-card-content>
            <p>Schedule and manage interviews</p>
          </mat-card-content>
          <mat-card-actions>
            <button mat-raised-button color="primary" (click)="navigateToInterviews()">
              Manage Interviews
            </button>
          </mat-card-actions>
        </mat-card>
      </div>
    </div>
